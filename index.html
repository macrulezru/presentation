    <style>
      .app-loader__wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #151515 0%, #0c0c0c 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }

      .app-loader__spinner {
        width: 180px;
        height: 180px;
        border: 12px solid #d941b0;
        border-top: 12px solid #ffffff;
        border-radius: 50%;
        animation: app-loader-spin 1s linear infinite;
        position: relative;
      }

      .app-loader__spinner::after {
        content: '';
        position: absolute;
        inset: 30px;
        border: 6px solid #f22ee5;
        border-top: 6px solid #ffffff;
        border-radius: 50%;
        animation: app-loader-spin-reverse 1.5s linear infinite;
      }

      @keyframes app-loader-spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes app-loader-spin-reverse {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(-360deg);
        }
      }
    </style>
    <div id="app-loader" class="app-loader__wrapper">
      <div class="app-loader__spinner"></div>
    </div>
