name: Deploy to Server (Hard Reset with npm ci)

on:
  push:
    branches: [master] # Можно изменить на нужную ветку

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hard deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER != '' && secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -euxo pipefail

            echo '🚀 Starting hard deploy for macrulez.ru'
            cd /var/www/macrulez.ru || { echo '❌ Directory not found!'; exit 1; }

            # ------------------------------------------------------------
            # 1. Жёсткая перезапись из git
            # ------------------------------------------------------------
            echo '>>> 🔄 Hard reset from git'
            git fetch origin
            git reset --hard origin/master
            git clean -fd

            # ------------------------------------------------------------
            # 2. Проверка наличия package-lock.json
            # ------------------------------------------------------------
            echo '>>> 🔍 Checking for package-lock.json'
            if [ ! -f package-lock.json ]; then
              echo '❌ ERROR: package-lock.json not found!'
              echo 'Please commit package-lock.json to ensure reproducible builds.'
              exit 1
            fi
            echo '✅ package-lock.json found'

            # ------------------------------------------------------------
            # 3. Загрузка переменных окружения (если есть)
            # ------------------------------------------------------------
            echo '>>> 🌱 Loading environment variables'
            set -a
            if [ -f .env ]; then
              source .env
              echo '✅ .env loaded'
            else
              echo '⚠️  No .env file found, continuing without it'
            fi
            set +a

            # ------------------------------------------------------------
            # 4. Полная зачистка перед сборкой
            # ------------------------------------------------------------
            echo '>>> 🧹 Cleaning build artifacts'
            rm -rf node_modules .output .nuxt

            # ------------------------------------------------------------
            # 5. Установка зависимостей (строго по lock-файлу)
            # ------------------------------------------------------------
            echo '>>> 📦 Installing dependencies with npm ci'
            npm ci --no-audit --no-fund

            # ------------------------------------------------------------
            # 6. Сборка проекта
            # ------------------------------------------------------------
            echo '>>> 🔨 Building project'
            npm run build

            # ------------------------------------------------------------
            # 7. Перезапуск PM2
            # ------------------------------------------------------------
            echo '>>> 🔄 Restarting PM2 process'
            pm2 delete macrulez.ru 2>/dev/null || true
            pm2 start .output/server/index.mjs \
              --name macrulez.ru \
              --update-env \
              -- --port 3001

            # Сохраняем список процессов для автозапуска
            pm2 save

            # ------------------------------------------------------------
            # 8. Проверка статуса
            # ------------------------------------------------------------
            echo '>>> ✅ Deploy complete! Checking status:'
            pm2 status macrulez.ru
            echo ''
            echo '🎉 Success! https://macrulez.ru'
