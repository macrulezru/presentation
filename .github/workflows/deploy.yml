name: Deploy to Server (Hard Reset with Port Check)

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hard deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER != '' && secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -euxo pipefail

            echo '🚀 Starting hard deploy for macrulez.ru'
            cd /var/www/macrulez.ru || { echo '❌ Directory not found!'; exit 1; }

            # ------------------------------------------------------------
            # 1. Жёсткая перезапись из git
            # ------------------------------------------------------------
            echo '>>> 🔄 Hard reset from git'
            git fetch origin
            git reset --hard origin/master
            git clean -fd

            # ------------------------------------------------------------
            # 2. Проверка наличия package-lock.json
            # ------------------------------------------------------------
            echo '>>> 🔍 Checking for package-lock.json'
            if [ ! -f package-lock.json ]; then
              echo '❌ ERROR: package-lock.json not found!'
              echo 'Please commit package-lock.json to ensure reproducible builds.'
              exit 1
            fi
            echo '✅ package-lock.json found'

            # ------------------------------------------------------------
            # 3. Загрузка переменных окружения (безопасно)
            # ------------------------------------------------------------
            echo '>>> 🌱 Loading environment variables'
            set -a
            if [ -f .env ]; then
              # Загружаем построенно, игнорируя ошибки
              set +e
              source .env 2>/dev/null || echo '⚠️  Warning: Error loading .env, continuing...'
              set -e
              echo '✅ .env processed'
            else
              echo '⚠️  No .env file found, continuing without it'
            fi
            set +a

            # ------------------------------------------------------------
            # 4. Полная зачистка перед сборкой
            # ------------------------------------------------------------
            echo '>>> 🧹 Cleaning build artifacts'
            rm -rf node_modules .output .nuxt

            # ------------------------------------------------------------
            # 5. Установка зависимостей (строго по lock-файлу)
            # ------------------------------------------------------------
            echo '>>> 📦 Installing dependencies with npm ci'
            npm ci --no-audit --no-fund

            # ------------------------------------------------------------
            # 6. Сборка проекта
            # ------------------------------------------------------------
            echo '>>> 🔨 Building project'
            npm run build

            # ------------------------------------------------------------
            # 7. Перезапуск PM2 (безопасный, с проверкой порта)
            # ------------------------------------------------------------
            echo '>>> 🔄 Cleaning old PM2 processes'

            # Убиваем процессы по имени
            pm2 delete macrulez 2>/dev/null || true
            pm2 delete macrulez.ru 2>/dev/null || true

            # Убеждаемся, что порт 3001 свободен
            echo '>>> 🔍 Checking if port 3001 is free'
            if command -v lsof >/dev/null 2>&1; then
              # Используем lsof если доступен
              if lsof -Pi :3001 -sTCP:LISTEN -t >/dev/null 2>&1; then
                echo '⚠️  Port 3001 is in use, killing process...'
                fuser -k 3001/tcp 2>/dev/null || true
                sleep 2
              fi
            else
              # Fallback: используем netstat
              if netstat -tln | grep -q ":3001 "; then
                echo '⚠️  Port 3001 is in use, killing process...'
                fuser -k 3001/tcp 2>/dev/null || true
                sleep 2
              fi
            fi
            echo '✅ Port 3001 is free'

            echo '>>> 🚀 Starting fresh PM2 process'
            PORT=3001 pm2 start .output/server/index.mjs \
              --name macrulez.ru \
              --update-env

            # Сохраняем список процессов для автозапуска
            pm2 save

            # ------------------------------------------------------------
            # 8. Финальная проверка
            # ------------------------------------------------------------
            echo '>>> 📋 Current PM2 processes:'
            pm2 list

            echo '>>> ✅ Deploy complete!'
            echo ''
            echo '🎉 Success! https://macrulez.ru'
